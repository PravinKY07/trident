[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trident-windows"
version = "0.9.0"
description = "Local AI process security for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-MODEL"]
authors = [
    {name = "Aalok Singh"},
    {name = "Pravinkumar Yadav"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9",
    "numpy>=1.26",
    "onnxruntime>=1.31",
    "transformers>=4.40",
    "pydantic>=2.0",
    "winotify>=1.1",
    "huggingface_hub>=0.20",
]

[project.scripts]
trident = "trident.cli:main"

[project.urls]
Homepage = "https://github.com/aalok101singh/trident"
Model = "https://huggingface.co/aalok101singh/trident-v1"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["trident*"]

[tool.setuptools.package-data]
trident = [
    "data/*.toml",
    "data/*.json",
    "data/icons/*.png",
    "data/icons/*.ico",
]
