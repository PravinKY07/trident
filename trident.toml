# TRIDENT — configuration
# All values have safe defaults. Edit only if you know why.

[model]
repo = "aalok101singh/trident-laya-process-security-v1"
filename = "trident-v1.onnx"
expected_sha256 = "TO_BE_FILLED_AFTER_UPLOAD"
runtime = "onnxruntime"
execution_provider = "CPUExecutionProvider"
intra_op_threads = 1
inter_op_threads = 1
execution_mode = "sequential"
enable_memory_arena = false
max_len = 1024
head_max_len = 256

[telemetry]
provider = "Microsoft-Windows-Kernel-Process"
ring_buffer_size = 256
metadata_cache_size = 1024
batch_size_max = 16
batch_window_ms = 200
wmi_fallback_enabled = true
wmi_poll_interval_seconds = 10

[cascade]
tier1_threshold = 0.92
tier2_threshold = 0.70
tier2_max_cycles = 3
escalation_suppression_after = 3
toast_timeout_seconds = 30

[action]
safety_whitelist = [
    "C:\\Windows\\",
    "C:\\Program Files\\",
    "C:\\Program Files (x86)\\",
]
suspend_timeout_ms = 500
verify_timeout_ms = 500
generate_ps1 = true
ps1_output_dir = "./cleanup-scripts"

[logging]
level = "INFO"
format = "jsonl"
log_dir = "./logs"
prefix = "[TRIDENT]"

[ui]
strings_file = "./strings.json"
default_locale = "en"
